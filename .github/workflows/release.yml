name: Release Build

on:
  push:
    branches:
      - Dev/Punchy
  workflow_dispatch: {}

permissions:
  contents: write

env:
  LOVE_VERSION: "11.5"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version tag (v{date}-b{N})
        id: compute
        run: |
          DATE=$(date -u +%Y.%m.%d)
          # Count existing tags for today's date to find the next build number
          EXISTING=$(git tag -l "v${DATE}-b*" | wc -l)
          N=$((EXISTING + 1))
          TAG="v${DATE}-b${N}"
          echo "Computed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.compute.outputs.tag }}"
          git push origin "${{ steps.compute.outputs.tag }}"

  desktop:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .love file
        run: |
          zip -9 -r teblocks.love . \
            -x ".git/*" -x ".github/*" -x "*.DS_Store" -x "dist/*"

      - name: Package Linux (fused AppImage)
        run: |
          curl -L -o love-linux.AppImage \
            https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-x86_64.AppImage
          chmod +x love-linux.AppImage
          mkdir -p dist
          cat love-linux.AppImage teblocks.love > dist/teblocks-linux.AppImage
          chmod +x dist/teblocks-linux.AppImage

      - name: Package Windows (fused exe)
        run: |
          curl -L -o love-win.zip \
            https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-win64.zip
          unzip -q love-win.zip -d love-win
          WINDIR="love-win/love-${LOVE_VERSION}-win64"
          mkdir -p dist/teblocks-windows
          cat "$WINDIR/love.exe" teblocks.love > dist/teblocks-windows/teblocks.exe
          cp "$WINDIR"/*.dll dist/teblocks-windows/ 2>/dev/null || true
          cp "$WINDIR/license.txt" dist/teblocks-windows/ 2>/dev/null || true
          cd dist && zip -9 -r teblocks-windows-portable.zip teblocks-windows && cd ..

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-builds
          path: |
            dist/teblocks-linux.AppImage
            dist/teblocks-windows-portable.zip
          retention-days: 7

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout love-android
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          ref: ${{ env.LOVE_VERSION }}  # pin to match desktop LOVE_VERSION if a matching tag exists; otherwise use a known-good branch/tag
          submodules: recursive
          path: love-android

      - name: Checkout TeBlocks source
        uses: actions/checkout@v4
        with:
          path: teblocks-src

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # ubuntu-latest ships with the Android SDK preinstalled; no setup-android action needed.

      - name: Override app identity via gradle.properties
        run: |
          # love-android reads app name/id/version from gradle.properties, NOT strings.xml —
          # these are injected into AndroidManifest.xml via manifestPlaceholders at build time.
          cat > love-android/gradle.properties << EOF
          app.name=TeBlocks
          app.application_id=my.id.teblocks.android
          app.orientation=portrait
          app.version_code=${{ github.run_number }}
          app.version_name=${{ needs.version.outputs.tag }}

          android.enableJetifier=false
          android.useAndroidX=true
          android.defaults.buildfeatures.buildconfig=true
          android.nonTransitiveRClass=true
          android.nonFinalResIds=true
          EOF
          echo "--- Patched gradle.properties ---"
          cat love-android/gradle.properties

      - name: Build .love file
        run: |
          cd teblocks-src
          zip -9 -r ../teblocks.love . \
            -x ".git/*" -x ".github/*" -x "*.DS_Store" -x "dist/*"
          cd ..

      - name: Inspect .love contents (debug)
        run: |
          echo "--- Top-level entries in teblocks.love ---"
          unzip -l teblocks.love | head -n 30
          echo "--- Checking for main.lua at root ---"
          unzip -l teblocks.love | grep -E "^\s.*\smain\.lua$" || echo "WARNING: main.lua not found at all in the archive"
          echo "--- conf.lua contents (if present) ---"
          unzip -p teblocks.love conf.lua 2>/dev/null | grep -i version || echo "No conf.lua or no t.version line found"

      - name: Embed .love into love-android
        run: |
          mkdir -p love-android/app/src/embed/assets
          cp teblocks.love love-android/app/src/embed/assets/game.love

      - name: Decode keystore (if configured)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > love-android/teblocks-release.jks

      - name: Build APK (release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd love-android
          # love-android flavors are EmbedRecord / EmbedNoRecord (mic permission) x Debug/Release.
          # TeBlocks doesn't need mic access, so we build EmbedNoRecordRelease.
          # Output: app/build/outputs/apk/embedNoRecord/release/*.apk (unsigned unless a signingConfig is wired in).
          ./gradlew assembleEmbedNoRecordRelease --stacktrace

      - name: Inspect build directory (debug)
        run: |
          echo "--- app/build contents (2 levels) ---"
          find love-android/app/build -maxdepth 3 2>/dev/null || echo "love-android/app/build does not exist at all"

      - name: List APK outputs (debug)
        run: |
          echo "Searching for APKs under love-android/app/build/outputs..."
          find love-android/app/build/outputs -type f -name "*.apk" || true

      - name: Locate unsigned APK
        id: locate
        run: |
          APK_PATH=$(find love-android/app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found under love-android/app/build/outputs — build likely failed silently or produced no output."
            exit 1
          fi
          echo "Found unsigned APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Align and sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          echo "Using build-tools: $BUILD_TOOLS"

          mkdir -p dist
          "$ZIPALIGN" -f -p 4 "${{ steps.locate.outputs.apk_path }}" dist/teblocks-aligned.apk

          "$APKSIGNER" sign \
            --ks love-android/teblocks-release.jks \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out dist/teblocks-android.apk \
            dist/teblocks-aligned.apk

          "$APKSIGNER" verify dist/teblocks-android.apk && echo "APK signature verified OK"

      - name: Verify final APK contents (debug)
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name "aapt" | sort -V | tail -n 1)
          echo "--- Package / label / version from built APK ---"
          "$AAPT" dump badging dist/teblocks-android.apk | grep -E "package:|application-label:|launchable-activity:"
          echo ""
          echo "--- Confirming game.love is present inside the APK ---"
          "$AAPT" list dist/teblocks-android.apk | grep "game.love" || echo "WARNING: game.love NOT found inside the built APK!"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: dist/teblocks-android.apk
          retention-days: 7

  release:
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            desktop-builds/teblocks-linux.AppImage
            desktop-builds/teblocks-windows-portable.zip
            android-build/teblocks-android.apk
          generate_release_notes: true

