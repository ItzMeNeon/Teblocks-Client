name: Release Build

on:
  push:
    branches:
      - Dev/Punchy
  workflow_dispatch: {}

permissions:
  contents: write

env:
  LOVE_VERSION: "11.5"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version tag (v{date}-b{N})
        id: compute
        run: |
          DATE=$(date -u +%Y.%m.%d)
          # Count existing tags for today's date to find the next build number
          EXISTING=$(git tag -l "v${DATE}-b*" | wc -l)
          N=$((EXISTING + 1))
          TAG="v${DATE}-b${N}"
          echo "Computed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.compute.outputs.tag }}"
          git push origin "${{ steps.compute.outputs.tag }}"

  desktop:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate platform icons
        run: |
          pip install Pillow
          python3 .github/scripts/generate_icons.py

      - name: Build .love file
        run: |
          zip -9 -r teblocks.love . \
            -x ".git/*" -x ".github/*" -x "*.DS_Store" -x "dist/*" -x "ColdClear/*" -x "*.love"
          mkdir -p dist
          cp teblocks.love dist/teblocks.love

      - name: Package Linux (AppImage)
        run: |
          curl -L -o love-linux.AppImage \
            https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-x86_64.AppImage
          chmod +x love-linux.AppImage

          # Extract official AppImage
          ./love-linux.AppImage --appimage-extract

          # Fuse game into bin/love
          cat squashfs-root/bin/love teblocks.love > squashfs-root/bin/love.fused
          mv squashfs-root/bin/love.fused squashfs-root/bin/love
          chmod +x squashfs-root/bin/love

          # Also embed teblocks.love and set FUSE_PATH in AppRun
          cp teblocks.love squashfs-root/teblocks.love
          sed -i 's|#FUSE_PATH="$APPDIR/my_game.love"|FUSE_PATH="$APPDIR/teblocks.love"|' squashfs-root/AppRun

          # Copy ColdClear Linux library if present
          mkdir -p squashfs-root/lib/lua/5.1
          cp ColdClear/Linux/CCloader.so squashfs-root/lib/lua/5.1/ 2>/dev/null || true

          # Update desktop metadata and icons
          sed -i 's/^Name=.*/Name=TeBlocks/' squashfs-root/love.desktop
          if [ -f .github/build/linux/release/icon.png ]; then
            cp .github/build/linux/release/icon.png squashfs-root/teblocks.png
            cp .github/build/linux/release/icon.png squashfs-root/love.png
            cp .github/build/linux/release/icon.png squashfs-root/.DirIcon
            sed -i 's/^Icon=.*/Icon=teblocks/' squashfs-root/love.desktop
          fi

          # Repackage AppImage with appimagetool
          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root dist/teblocks-linux.AppImage
          chmod +x dist/teblocks-linux.AppImage

      - name: Package Windows (fused exe)
        run: |
          curl -L -o love-win.zip \
            https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-win64.zip
          unzip -q love-win.zip -d love-win
          WINDIR="love-win/love-${LOVE_VERSION}-win64"

          # Embed custom icon into love.exe if icon.ico is present
          if [ -f .github/build/windows/release/icon.ico ]; then
            sudo apt-get update -qq && sudo apt-get install -y wine64 wine || true
            curl -sL https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -o rcedit.exe
            wine rcedit.exe "$WINDIR/love.exe" --set-icon .github/build/windows/release/icon.ico || true
          fi

          mkdir -p dist/teblocks-windows
          cat "$WINDIR/love.exe" teblocks.love > dist/teblocks-windows/teblocks.exe
          cp "$WINDIR"/*.dll dist/teblocks-windows/ 2>/dev/null || true
          cp "$WINDIR/license.txt" dist/teblocks-windows/ 2>/dev/null || true
          cp ColdClear/Windows/x64/*.dll dist/teblocks-windows/ 2>/dev/null || true
          cd dist && zip -9 -r teblocks-windows-portable.zip teblocks-windows && cd ..

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-builds
          path: |
            dist/teblocks-linux.AppImage
            dist/teblocks-windows-portable.zip
            dist/teblocks.love
          retention-days: 7

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout love-android
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          ref: ${{ env.LOVE_VERSION }}
          submodules: recursive
          path: love-android

      - name: Checkout TeBlocks source
        uses: actions/checkout@v4
        with:
          path: teblocks-src

      - name: Generate Android icons
        run: |
          pip install Pillow
          python3 teblocks-src/.github/scripts/generate_icons.py teblocks-src/logo.png teblocks-src || python3 teblocks-src/.github/scripts/generate_icons.py teblocks-src/icon.png teblocks-src || python3 teblocks-src/.github/scripts/generate_icons.py teblocks-src

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Configure app identity & disable asset compression
        run: |
          cat > love-android/gradle.properties << EOF
          app.name=TeBlocks
          app.application_id=my.id.teblocks.android
          app.orientation=sensorLandscape
          app.version_code=${{ github.run_number }}
          app.version_name=${{ needs.version.outputs.tag }}

          android.enableJetifier=false
          android.useAndroidX=true
          android.defaults.buildfeatures.buildconfig=true
          android.nonTransitiveRClass=true
          android.nonFinalResIds=true
          EOF

          # Prevent AAPT from compressing assets so PhysFS can memory-map them
          sed -i '/lint {/i \    aaptOptions {\n        noCompress ""\n    }' love-android/app/build.gradle

          # Fix love-android 11.5 GameActivity bug where needToCopyGameInArchive stays false in embed flavor
          sed -i 's/needToCopyGameInArchive = false;/needToCopyGameInArchive = true;/g' love-android/love/src/main/java/org/love2d/android/GameActivity.java

      - name: Embed game assets into love-android
        run: |
          mkdir -p love-android/app/src/embed/assets

          # Unpack game files directly into assets so main.lua is at root of assets/
          # This enables PhysFS virtual archive mounting (ASET.AASSET) in LÖVE Android
          rsync -av \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='ColdClear' \
            --exclude='love-android' \
            --exclude='teblocks-src' \
            teblocks-src/ love-android/app/src/embed/assets/

          if [ ! -f love-android/app/src/embed/assets/main.lua ]; then
            echo "ERROR: main.lua not found in love-android/app/src/embed/assets/"
            exit 1
          fi

          # Embed ColdClear Android libraries if available
          mkdir -p love-android/app/src/main/jniLibs
          cp -r teblocks-src/ColdClear/Android/* love-android/app/src/main/jniLibs/ 2>/dev/null || true

          # Copy custom Android app icons into love-android resources (both main and embed flavors)
          if [ -d teblocks-src/.github/build/android/release/res ]; then
            echo "Embedding custom Android app icons..."
            mkdir -p love-android/app/src/main/res love-android/app/src/embed/res
            cp -r teblocks-src/.github/build/android/release/res/* love-android/app/src/main/res/ 2>/dev/null || true
            cp -r teblocks-src/.github/build/android/release/res/* love-android/app/src/embed/res/ 2>/dev/null || true

            # Update AndroidManifest to reference @mipmap/icon and @mipmap/icon_round (or fallback to love drawable)
            sed -i 's|android:icon="@drawable/love"|android:icon="@mipmap/icon" android:roundIcon="@mipmap/icon_round"|g' love-android/app/src/main/AndroidManifest.xml
          fi

      - name: Decode keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > love-android/teblocks-release.jks
            echo "Keystore decoded successfully"
          else
            echo "No keystore secret configured; proceeding with unsigned build"
          fi

      - name: Build APK (release)
        run: |
          cd love-android
          ./gradlew assembleEmbedNoRecordRelease --stacktrace

      - name: Locate unsigned APK
        id: locate
        run: |
          APK_PATH=$(find love-android/app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found under love-android/app/build/outputs — build likely failed silently or produced no output."
            exit 1
          fi
          echo "Found unsigned APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Align and sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          echo "Using build-tools: $BUILD_TOOLS"

          mkdir -p dist
          if [ -f love-android/teblocks-release.jks ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ]; then
            "$ZIPALIGN" -f -p 4 "${{ steps.locate.outputs.apk_path }}" dist/teblocks-aligned.apk

            "$APKSIGNER" sign \
              --ks love-android/teblocks-release.jks \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --out dist/teblocks-android.apk \
              dist/teblocks-aligned.apk

            "$APKSIGNER" verify dist/teblocks-android.apk && echo "APK signature verified OK"
          else
            echo "Keystore not configured or password missing, copying unaligned/unsigned APK"
            cp "${{ steps.locate.outputs.apk_path }}" dist/teblocks-android.apk
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: dist/teblocks-android.apk
          retention-days: 7

  release:
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            desktop-builds/teblocks-linux.AppImage
            desktop-builds/teblocks-windows-portable.zip
            desktop-builds/teblocks.love
            android-build/teblocks-android.apk
          generate_release_notes: true
